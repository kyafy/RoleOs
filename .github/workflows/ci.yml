name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Maven 质量与安全门禁
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 执行构建、测试与质量门禁
        run: mvn -B -ntp -Pquality verify
        env:
          # 未配置时依赖扫描仍会执行，但首次 NVD 同步会明显变慢。
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  secret-scan:
    name: 密钥泄露扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出完整 Git 历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 执行 Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
