services:
  postgres:
    image: postgres:17-alpine
    container_name: roleos-postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${ROLEOS_POSTGRES_DB:-roleos}
      POSTGRES_USER: ${ROLEOS_POSTGRES_USER:-roleos_app}
      POSTGRES_PASSWORD: ${ROLEOS_POSTGRES_PASSWORD:-roleos_local_dev_change_me}
    ports:
      - "${ROLEOS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
